name: Release

on:
  push:
    tags: ["v*.*.*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  Release-Build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      attestations: write
      id-token: write
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-apple-darwin
        rustup_toolchain: [stable]
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rustup_toolchain }}

      - name: Install cross-compilation tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Install musl target
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: rustup target add ${{ matrix.target }}

      - name: Configure static linking environment
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          echo "RUSTFLAGS=-C target-feature=+crt-static" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALL_STATIC=1" >> $GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $GITHUB_ENV
          echo "LIBZ_SYS_STATIC=1" >> $GITHUB_ENV

      - name: Cargo build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Show version
        run: ./target/${{ matrix.target }}/release/gx --version

      - name: Verify musl static linking
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          echo "Verifying musl static linking..."
          echo "Debug info: Testing binary with ldd..."
          ldd_result=$(ldd ./target/${{ matrix.target }}/release/gx 2>&1)
          echo "ldd output: $ldd_result"
          if echo "$ldd_result" | grep -q "statically linked"; then
            echo "✓ musl binary verified as statically linked"
          else
            echo "✗ musl binary shows dynamic dependencies:"
            echo "$ldd_result"
            exit 1
          fi

      - name: Archive (UNIX)
        run: |
          mkdir -p artifacts
          cp -av target/${{ matrix.target }}/release/gx artifacts/
          tar -czf ${{ github.event.repository.name }}-${{ github.ref_name }}-${{ matrix.target }}.tar.gz  artifacts
        if: ${{ ! startsWith(matrix.os, 'windows') }}

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: ${{ github.event.repository.name }}-${{ github.ref_name }}-${{ matrix.target }}.*

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ github.ref_name }}-${{ matrix.target }}
          path: ${{ github.event.repository.name }}-${{ github.ref_name }}-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 7

  Release:
    needs: [Release-Build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure artifacts dir exists
        run: mkdir -p artifacts

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve manifest target
        id: manifest_ctx
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          channel="stable"
          branch="main"
          manifest_path="updates/stable/manifest.json"
          # Channel resolution:
          # - any alpha marker -> alpha channel
          # - beta/pre marker -> beta channel
          # This prevents prerelease tags from polluting stable manifests.
          if [[ "$version" == *"-alpha"* || "$version" == *"alpha-"* ]]; then
            channel="alpha"
            branch="alpha"
            manifest_path="updates/alpha/manifest.json"
          elif [[ "$version" == *"-beta"* || "$version" == *"beta-"* || "$version" == *"-pre"* || "$version" == *"pre-"* ]]; then
            channel="beta"
            branch="beta"
            manifest_path="updates/beta/manifest.json"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "manifest_path=$manifest_path" >> "$GITHUB_OUTPUT"

      - name: Checkout manifest branch
        run: |
          set -euo pipefail
          branch="${{ steps.manifest_ctx.outputs.branch }}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
          else
            echo "Branch '$branch' not found, creating from origin/main"
            git fetch origin main
            git checkout -B "$branch" "origin/main"
          fi

      - name: Generate manifest from release artifacts
        run: |
          set -euo pipefail
          repo="${{ github.event.repository.name }}"
          tag="${{ github.ref_name }}"
          channel="${{ steps.manifest_ctx.outputs.channel }}"
          version="${{ steps.manifest_ctx.outputs.version }}"
          manifest_path="${{ steps.manifest_ctx.outputs.manifest_path }}"
          published_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          shopt -s nullglob
          files=(artifacts/${repo}-${tag}-*.tar.gz)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release tar.gz artifacts found under artifacts/"
            exit 1
          fi

          assets='{}'
          for asset in "${files[@]}"; do
            filename="$(basename "$asset")"
            target="${filename#${repo}-${tag}-}"
            target="${target%.tar.gz}"
            sha256="$(sha256sum "$asset" | awk '{print $1}')"
            url="https://github.com/${{ github.repository }}/releases/download/${tag}/${filename}"
            assets="$(jq -c --arg target "$target" --arg url "$url" --arg sha "$sha256" '. + {($target): {url: $url, sha256: $sha}}' <<<"$assets")"
          done

          mkdir -p "$(dirname "$manifest_path")"
          jq -n \
            --arg version "$version" \
            --arg channel "$channel" \
            --arg published_at "$published_at" \
            --arg git_ref "$tag" \
            --arg git_commit "${GITHUB_SHA}" \
            --argjson assets "$assets" \
            '{version:$version, channel:$channel, published_at:$published_at, git_ref:$git_ref, git_commit:$git_commit, assets:$assets}' > "$manifest_path"

          cat "$manifest_path"

      - name: Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Welcome to this new release of GalaxyFlow ${{ github.ref_name }}!

            All artifacts are signed with this repos identity using Sigstore.
            You can verify the signatures using the `GitHub` CLI.

            ```shell
            gh attestation verify --owner ${{ github.repository_owner }} <my-artifact>
            ```
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ steps.manifest_ctx.outputs.channel != 'stable' || contains(github.ref_name, '-pre') }}
          files: artifacts/*

      - name: Commit and push manifest update
        run: |
          set -euo pipefail
          branch="${{ steps.manifest_ctx.outputs.branch }}"
          channel="${{ steps.manifest_ctx.outputs.channel }}"
          tag="${{ github.ref_name }}"
          manifest_path="${{ steps.manifest_ctx.outputs.manifest_path }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$manifest_path"

          if git diff --cached --quiet; then
            echo "Manifest unchanged, skip commit."
            exit 0
          fi

          git commit -m "chore(updates): refresh ${channel} manifest for ${tag}"
          git push origin "$branch"
