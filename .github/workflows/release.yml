name: Release

on:
  push:
    tags: ["v*.*.*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  Release-Build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      attestations: write
      id-token: write
    strategy:
      matrix:
        # 固定平台矩阵：三份制品同版本齐备，供控制中心稳定解析。
        # Linux 统一用 musl 静态链接（跨发行版/容器通用，不再出 glibc 制品）。
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - aarch64-apple-darwin
        rustup_toolchain: [stable]
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-musl
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rustup_toolchain }}

      - name: Install cross-compilation tools
        if: contains(matrix.target, 'musl')
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Install musl target
        if: contains(matrix.target, 'musl')
        run: rustup target add ${{ matrix.target }}

      - name: Configure static linking environment
        if: contains(matrix.target, 'musl')
        run: |
          echo "RUSTFLAGS=-C target-feature=+crt-static" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALL_STATIC=1" >> $GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $GITHUB_ENV
          echo "LIBZ_SYS_STATIC=1" >> $GITHUB_ENV

      - name: Cargo build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Show version
        # aarch64-musl 在 x86_64 runner 上无法直接执行（无 qemu），此处跳过；
        # 该制品的可用性由控制中心在各目标机上验证。
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: ./target/${{ matrix.target }}/release/gx --version

      - name: Verify static linking (musl)
        if: contains(matrix.target, 'musl')
        run: |
          # 用 `file` 而非 `ldd`：ldd 无法分析交叉架构（aarch64）二进制，
          # 而 `file` 输出同时覆盖 "statically linked" 与 "static-pie linked"。
          bin="target/${{ matrix.target }}/release/gx"
          echo "file: $(file "$bin")"
          if file "$bin" | grep -q "static"; then
            echo "✓ ${{ matrix.target }} verified as statically linked"
          else
            echo "✗ ${{ matrix.target }} is not statically linked"
            exit 1
          fi

      - name: Archive (UNIX)
        # 包内顶层目录名 == 资产名（含 triple），使控制中心「按目录名取平台」不落空。
        run: |
          pkg="${{ github.event.repository.name }}-${{ github.ref_name }}-${{ matrix.target }}"
          rm -rf "$pkg"
          mkdir -p "$pkg"
          cp -av "target/${{ matrix.target }}/release/gx" "$pkg/"
          tar -czf "$pkg.tar.gz" "$pkg"
        if: ${{ ! startsWith(matrix.os, 'windows') }}

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: ${{ github.event.repository.name }}-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ github.ref_name }}-${{ matrix.target }}
          path: ${{ github.event.repository.name }}-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  Release:
    needs: [Release-Build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure artifacts dir exists
        run: mkdir -p artifacts

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve channel
        id: channel
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          channel="stable"
          if [[ "$version" == *"-alpha"* || "$version" == *"alpha-"* ]]; then
            channel="alpha"
          elif [[ "$version" == *"-beta"* || "$version" == *"beta-"* || "$version" == *"-pre"* || "$version" == *"pre-"* ]]; then
            channel="beta"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Welcome to this new release of GalaxyFlow ${{ github.ref_name }}!

            All artifacts are signed with this repos identity using Sigstore.
            You can verify the signatures using the `GitHub` CLI.

            ```shell
            gh attestation verify --owner ${{ github.repository_owner }} <my-artifact>
            ```

            ## Installation

            ```bash
            # Check for updates
            gx self check --channel ${{ steps.channel.outputs.channel }}

            # Update to this version
            gx self update --channel ${{ steps.channel.outputs.channel }} --yes
            ```
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ steps.channel.outputs.channel != 'stable' || contains(github.ref_name, '-pre') }}
          files: artifacts/*

  # 把制品推到腾讯云 COS（对象存储），供中心 / CDN / 客户端按稳定 URL 拉取。
  # 未配置 Variables（COS_BUCKET 为空）时整段自动跳过，不会让发布失败；
  # 一旦设置 COS_BUCKET 即视为启用，此时密钥缺失会直接报错（便于发现漏配）。
  # 注意：`secrets` 上下文不能出现在 step 级 if 里，故启用判定放在 job 级（只看 vars）。
  #   Variables：COS_BUCKET（含 -APPID）、COS_REGION（如 ap-hongkong）、可选 COS_PREFIX（默认仓库名）
  #   Secrets：  COS_SECRET_ID、COS_SECRET_KEY（临时密钥再加 COS_SESSION_TOKEN）
  # 对象键：
  #   <COS_PREFIX>/<tag>/<文件名>              固定版本地址（可直接写进 ops-prj.yml 的 addr）
  #   <COS_PREFIX>/<channel>/latest/<文件名>   通道最新（alpha / beta / stable）
  #   <COS_PREFIX>/latest/<文件名>             仅 stable 更新，避免 alpha/beta 覆盖稳定版
  # 每个对象带自定义元数据 x-cos-meta-artifact-sha256=<hex>（COS 只存 MD5 ETag）。
  upload-cos:
    name: Upload artifacts to Tencent COS
    needs: [Release]
    runs-on: ubuntu-24.04
    if: ${{ vars.COS_BUCKET != '' }}
    concurrency:
      group: cos-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Resolve channel
        id: meta
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          CHANNEL="stable"
          if [[ "$VERSION" == *"-alpha"* || "$VERSION" == *"alpha-"* ]]; then
            CHANNEL="alpha"
          elif [[ "$VERSION" == *"-beta"* || "$VERSION" == *"beta-"* || "$VERSION" == *"-pre"* || "$VERSION" == *"pre-"* ]]; then
            CHANNEL="beta"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: pkg
          merge-multiple: true

      - name: Install coscli
        run: |
          set -eu
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/coscli" \
            https://github.com/tencentyun/coscli/releases/download/v1.0.9/coscli-v1.0.9-linux-amd64
          chmod +x "$HOME/.local/bin/coscli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/coscli" --version

      - name: Upload to COS
        env:
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
          COS_PREFIX: ${{ vars.COS_PREFIX }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_SESSION_TOKEN: ${{ secrets.COS_SESSION_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
        run: |
          set -eu
          # 去掉密钥里的空白字符：粘贴常带入尾随换行/空格，会让签名报 SecretKey is invalid。
          secret_id="$(printf '%s' "${COS_SECRET_ID}" | tr -d '[:space:]')"
          secret_key="$(printf '%s' "${COS_SECRET_KEY}" | tr -d '[:space:]')"
          session_token="$(printf '%s' "${COS_SESSION_TOKEN}" | tr -d '[:space:]')"
          if [ -z "${secret_id}" ] || [ -z "${secret_key}" ]; then
            echo "::error::已配置 COS_BUCKET，但 COS_SECRET_ID / COS_SECRET_KEY 为空"
            exit 1
          fi
          # 明文写入 AK/SK，因此必须显式关掉 coscli 的密钥加密（disableencryption）。
          cat > "$HOME/.cos.yaml" <<EOF
          cos:
            base:
              protocol: https
              disableencryption: "true"
              secretid: "${secret_id}"
              secretkey: "${secret_key}"
              sessiontoken: "${session_token}"
            buckets:
              - name: "${COS_BUCKET}"
                alias: "${COS_BUCKET}"
                region: "${COS_REGION}"
                endpoint: "cos.${COS_REGION}.myqcloud.com"
          EOF
          prefix="${COS_PREFIX:-${GITHUB_REPOSITORY##*/}}"
          prefix="${prefix%/}"
          cfg="$HOME/.cos.yaml"
          out="$PWD/coscli_output"
          rm -rf "${out}"
          # coscli 只打印汇总，失败明细落在 coscli_output/<时间>/ 下；失败时打印并输出为 annotation。
          dump_err() {
            echo "::error::$1"
            if [ -d "${out}" ]; then
              find "${out}" -type f -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \;
              detail="$(find "${out}" -type f -exec cat {} \; | tr '\n' ' ' | sed -e 's/%/%25/g' | cut -c1-1500)"
              echo "::error title=coscli 明细::$1 —— ${detail}"
            fi
            exit 1
          }
          # 依次写入的 key 前缀：固定版本 / 通道最新 / stable 的全局 latest。
          if [ "${CHANNEL}" = "stable" ]; then
            keys=("${prefix}/${TAG}" "${prefix}/${CHANNEL}/latest" "${prefix}/latest")
          else
            keys=("${prefix}/${TAG}" "${prefix}/${CHANNEL}/latest")
          fi
          shopt -s nullglob
          files=(pkg/*.tar.gz)
          [ ${#files[@]} -gt 0 ] || { echo "::error::pkg/ 下没有 .tar.gz 制品可上传"; exit 1; }
          for f in "${files[@]}"; do
            name="$(basename "${f}")"
            # COS 对象只存 MD5（ETag），GitHub 侧资产 digest（sha256）过不来。把 sha256 作为
            # 对象自定义元数据写进对象本身；`coscli stat`（HEAD）可读回。
            sha="$(sha256sum "${f}" | cut -d' ' -f1)"
            [ -n "${sha}" ] || { echo "::error::无法计算 ${name} 的 sha256" >&2; exit 1; }
            meta="x-cos-meta-artifact-sha256:${sha}"
            for key in "${keys[@]}"; do
              coscli cp "${f}" "cos://${COS_BUCKET}/${key}/${name}" -c "${cfg}" --meta "${meta}" \
                || dump_err "上传 ${name} 到 ${key} 失败"
              echo "已上传 ${key}/${name}  sha256=${sha}"
            done
          done
          echo "COS 上传完成。"
          coscli ls "cos://${COS_BUCKET}/${prefix}/" -c "${cfg}" \
            || echo "::warning::COS 列表失败（可能缺 cos:GetBucket 权限）；上传本身已成功。"

  update-gx-get-manifest:
    needs: [Release]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    concurrency:
      group: gx-get-updates
      cancel-in-progress: false
    steps:
      - name: Determine channel
        id: meta
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ "$VERSION" == *"-alpha"* || "$VERSION" == *"alpha-"* ]]; then
            CHANNEL="alpha"
          elif [[ "$VERSION" == *"-beta"* || "$VERSION" == *"beta-"* || "$VERSION" == *"-pre"* || "$VERSION" == *"pre-"* ]]; then
            CHANNEL="beta"
          else
            CHANNEL="stable"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Ensure GX_GET_TOKEN exists
        env:
          GX_GET_TOKEN: ${{ secrets.GX_GET_TOKEN }}
        run: |
          if [[ -z "${GX_GET_TOKEN}" ]]; then
            echo "missing required secret: GX_GET_TOKEN"
            exit 1
          fi

      - name: Fetch release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${{ steps.meta.outputs.tag }}" > /tmp/release.json

      - name: Build assets map
        run: |
          set -euo pipefail
          # 生成平台资产映射。过渡期额外补 glibc 时代的 key 别名，指向 musl 资产，
          # 使尚未升级（仍请求 *-unknown-linux-gnu）的旧客户端不要断链；
          # 待客户端铺开后移除别名（见 wp-update/docs/wp-self-update-platform-target.zh-CN.md）。
          jq -c '
            [ .assets[]
              | select(.name | test("^galaxy-flow-v[^/]+-(x86_64-unknown-linux-musl|aarch64-unknown-linux-musl|aarch64-apple-darwin)\\.tar\\.gz$"))
              | {
                  key: (.name | capture("-(?<target>x86_64-unknown-linux-musl|aarch64-unknown-linux-musl|aarch64-apple-darwin)\\.tar\\.gz$").target),
                  value: {
                    url: .browser_download_url,
                    sha256: ((.digest // "") | sub("^sha256:"; "") | ascii_downcase)
                  }
                }
            ] | from_entries
              | . + (
                  (if .["x86_64-unknown-linux-musl"] != null
                   then {"x86_64-unknown-linux-gnu": .["x86_64-unknown-linux-musl"]}
                   else {} end)
                  + (if .["aarch64-unknown-linux-musl"] != null
                     then {"aarch64-unknown-linux-gnu": .["aarch64-unknown-linux-musl"]}
                     else {} end)
                )
          ' /tmp/release.json > /tmp/assets.json

      - name: Checkout gx-get
        uses: actions/checkout@v4
        with:
          repository: galaxio-labs/get
          token: ${{ secrets.GX_GET_TOKEN }}
          path: gx-get

      - name: Update manifest and history
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          CHANNEL="${{ steps.meta.outputs.channel }}"
          PUBLISHED_AT="$(jq -r '.published_at // empty' /tmp/release.json)"
          if [[ -z "$PUBLISHED_AT" ]]; then
            PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi

          cd gx-get
          MANIFEST="updates/gx/${CHANNEL}/manifest.json"
          HISTORY="updates/gx/${CHANNEL}/versions/${TAG}.json"
          mkdir -p "$(dirname "$MANIFEST")" "$(dirname "$HISTORY")"

          # Read assets and compute sha256 if not provided by GitHub
          ASSETS_FILE="/tmp/assets.json"

          # If sha256 is empty, download and compute
          if jq -e 'to_entries | all(.value.sha256 != "")' "$ASSETS_FILE" >/dev/null; then
            echo "All assets have sha256 from release metadata"
          else
            echo "Computing sha256 for assets..."
            NEW_ASSETS='{}'
            for entry in $(jq -c 'to_entries[]' "$ASSETS_FILE"); do
              target=$(echo "$entry" | jq -r '.key')
              url=$(echo "$entry" | jq -r '.value.url')
              sha256=$(curl -sL "$url" | sha256sum | awk '{print $1}')
              NEW_ASSETS="$(echo "$NEW_ASSETS" | jq -c --arg target "$target" --arg url "$url" --arg sha "$sha256" '. + {($target): {url: $url, sha256: $sha}}')"
            done
            echo "$NEW_ASSETS" > "$ASSETS_FILE"
          fi

          jq -n \
            --arg version "$VERSION" \
            --arg channel "$CHANNEL" \
            --arg published_at "$PUBLISHED_AT" \
            --arg git_ref "$TAG" \
            --arg git_commit "${GITHUB_SHA}" \
            --slurpfile assets "$ASSETS_FILE" \
            '{
              version: $version,
              channel: $channel,
              published_at: $published_at,
              git_ref: $git_ref,
              git_commit: $git_commit,
              assets: $assets[0]
            }' > "$MANIFEST"

          cp "$MANIFEST" "$HISTORY"

          echo "Generated manifest:"
          cat "$MANIFEST"

      - name: Commit and push to gx-get
        run: |
          set -euo pipefail
          cd gx-get
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates
          if git diff --cached --quiet; then
            echo "no manifest changes"
            exit 0
          fi
          git commit -m "chore(updates): gx ${{ steps.meta.outputs.tag }} (${{ steps.meta.outputs.channel }})"
          git push